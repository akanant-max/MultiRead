<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>MultiRead</title>
<style>
  :root { --bg:#e9e9ec; --bar:#f7f7f8; --fg:#1b1b1f; --muted:#6b6b73; --accent:#2f6fed; --line:rgba(128,128,128,.28); }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1d1d20; --bar:#26262a; --fg:#ececf0; --muted:#9a9aa3; --accent:#7aa2ff; }
  }
  [hidden] { display:none !important; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; background:var(--bg); color:var(--fg); touch-action: pan-x pan-y;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { padding-bottom: 58px; overflow-anchor: none; }
  body.night { --bg:#0e0e10; }

  #hdr { position:sticky; top:0; left:0; z-index:20; background:var(--bar); border-bottom:1px solid var(--line); }
  #bar { display:flex; align-items:center; gap:6px; padding:6px 8px 6px 12px; height:46px; }
  #name { flex:1; min-width:0; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  button { font:inherit; font-size:14px; border:0; color:var(--fg); background:transparent; border-radius:8px; }
  button.pri { background:var(--accent); color:#fff; padding:7px 14px; }
  button.ic { width:38px; height:38px; display:flex; align-items:center; justify-content:center; }
  button.ic:active, #tb button:active { background:var(--line); }
  button.ic svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  button.on { color:var(--accent); }

  #findbar { display:flex; align-items:center; gap:4px; padding:4px 8px 8px 12px; }
  #findbar[hidden] { display:none; }
  #q { flex:1; min-width:0; font:inherit; font-size:15px; padding:8px 10px; border-radius:8px;
       border:1px solid var(--line); background:var(--bg); color:var(--fg); outline:none; }
  #fcount { font-size:12px; color:var(--muted); min-width:54px; text-align:center; white-space:nowrap; }

  #tabs { display:flex; gap:6px; overflow-x:auto; padding:6px 10px 8px; }
  #tabs:empty { display:none; }
  #tabs button { background:var(--bg); white-space:nowrap; padding:6px 12px; }
  #tabs button.on { background:var(--accent); color:#fff; }

  #tb { position:fixed; left:0; right:0; bottom:0; z-index:20; display:flex; align-items:center; gap:2px;
        padding:6px 8px calc(6px + env(safe-area-inset-bottom)); background:var(--bar); border-top:1px solid var(--line); }
  #tb[hidden] { display:none; }
  #tb button { min-width:40px; height:40px; font-size:18px; }
  #tb .sp { flex:1; }
  #pg, #zl { font-size:13px; min-width:74px; }
  #pgIn { width:74px; font:inherit; font-size:14px; padding:6px; text-align:center; border-radius:8px;
          border:1px solid var(--accent); background:var(--bg); color:var(--fg); }

  #msg { padding:28px 20px; text-align:center; color:var(--muted); line-height:1.5; white-space:pre-wrap; }
  #msg.err { color:#c0392b; }
  #home { padding:40px 20px; text-align:center; }
  #home .big { font-size:17px; padding:14px 28px; }
  #home p { color:var(--muted); font-size:13px; line-height:1.6; max-width:420px; margin:20px auto 0; }
  #recent { max-width:480px; margin:26px auto 0; text-align:left; }
  #recent h4 { margin:0 0 6px 4px; font-size:12px; font-weight:600; color:var(--muted); letter-spacing:.04em; text-transform:uppercase; }
  #recent button { display:block; width:100%; text-align:left; padding:12px; background:var(--bar); margin-bottom:6px;
                   white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  #scaler { position:relative; overflow:visible; }
  #view { transform-origin:0 0; padding:8px 0 0; }
  body.night #view { filter: invert(1) hue-rotate(180deg); }
  body.night #view img { filter: invert(1) hue-rotate(180deg); }

  /* PDF */
  .pdfpage { margin:0 auto 8px; background:#fff; box-shadow:0 1px 4px rgba(0,0,0,.25); position:relative; overflow:hidden; }
  .pdfpage canvas { position:absolute; left:0; top:0; width:100%; height:100%; display:block; }
  .textLayer { position:absolute; left:0; top:0; right:0; bottom:0; overflow:hidden; line-height:1; z-index:2; text-size-adjust:none; }
  .textLayer span, .textLayer br { color:transparent; position:absolute; white-space:pre; cursor:text; transform-origin:0% 0%; }
  .textLayer ::selection { background:rgba(47,111,237,.35); }
  .textLayer mark.hl { color:transparent; }

  mark.hl { background:#ffd54a; color:#000; border-radius:2px; }
  mark.hl.cur { background:#ff8a3d; }

  #view img.pic { display:block; max-width:100%; height:auto; margin:0 auto; }
  pre.txt { margin:0; padding:12px 14px; white-space:pre-wrap; word-wrap:break-word;
    font:13px/1.5 ui-monospace, Menlo, Consolas, monospace; background:var(--bar); }

  .sheet { padding:0 10px; }
  .sheet table { border-collapse:collapse; background:#fff; color:#000; font-size:13px; }
  .sheet td, .sheet th { border:1px solid #d0d0d6; padding:3px 7px; white-space:pre; vertical-align:top; }
  .note { padding:6px 12px; font-size:12px; color:var(--muted); }

  #view .docx-wrapper { background:transparent !important; padding:8px 0 !important; }
  .htmlframe { width:100%; border:0; background:#fff; display:block; min-height:80vh; }
  .slide-note { padding:8px 14px; font-size:12px; color:var(--muted); }
  .legacy h3 { margin:18px 14px 6px; font-size:13px; color:var(--muted); font-weight:600; }
  .legacy .slide { margin:0 14px; padding:12px; background:var(--bar); border-radius:8px; white-space:pre-wrap; font-size:14px; line-height:1.5; }
</style>
<script src="lib/jszip.min.js"></script>
<script src="lib/xlsx.full.min.js"></script>
<script src="lib/docx-preview.min.js"></script>
<script src="lib/pptx-preview.bundle.js"></script>
<script src="lib/pdf.min.js"></script>
</head>
<body>
<div id="hdr">
  <div id="bar">
    <div id="name"></div>
    <button class="ic" id="findBtn" aria-label="Find" hidden>
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
    <button class="ic" id="nightBtn" aria-label="Night mode">
      <svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button>
    <button class="pri" id="openBtn">Open</button>
  </div>
  <div id="findbar" hidden>
    <input id="q" type="search" placeholder="Find in document" autocomplete="off" autocapitalize="off" spellcheck="false">
    <span id="fcount"></span>
    <button class="ic" id="fprev" aria-label="Previous match"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button>
    <button class="ic" id="fnext" aria-label="Next match"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
    <button class="ic" id="fclose" aria-label="Close find"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div id="tabs"></div>
</div>

<div id="home" hidden>
  <button class="pri big" id="homeBtn">Open a file</button>
  <div id="recent"></div>
  <p>PDF · Word · Excel · PowerPoint · HTML · images · text<br>View only. Works offline.</p>
</div>
<div id="msg" hidden></div>
<div id="scaler"><div id="view"></div></div>

<div id="tb" hidden>
  <button id="pPrev" aria-label="Previous page">&#8249;</button>
  <button id="pg">–</button>
  <button id="pNext" aria-label="Next page">&#8250;</button>
  <span class="sp"></span>
  <button id="zOut" aria-label="Zoom out">&#8722;</button>
  <button id="zl">100%</button>
  <button id="zIn" aria-label="Zoom in">+</button>
</div>

<script>
(function () {
  "use strict";
  function $(id) { return document.getElementById(id); }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  var q = new URLSearchParams(location.search);
  var name = q.get("name") || "";
  var ext = (name.indexOf(".") >= 0 ? name.split(".").pop() : "").toLowerCase();
  var view = $("view"), scaler = $("scaler"), msgEl = $("msg"), hdr = $("hdr");
  var kind = "", docKey = "";

  function pick() { try { Native.pick(); } catch (e) {} }
  $("openBtn").onclick = pick; $("homeBtn").onclick = pick;
  function show(text, isErr) { msgEl.hidden = false; msgEl.className = isErr ? "err" : ""; msgEl.textContent = text; }
  function clearMsg() { msgEl.hidden = true; }
  function viewW() { return document.documentElement.clientWidth; }
  function hdrH() { return hdr.offsetHeight; }

  /* ---------- night mode ---------- */
  if (lsGet("night") === "1") document.body.classList.add("night");
  $("nightBtn").classList.toggle("on", document.body.classList.contains("night"));
  $("nightBtn").onclick = function () {
    var on = document.body.classList.toggle("night");
    $("nightBtn").classList.toggle("on", on); lsSet("night", on ? "1" : "0");
  };

  /* ---------- home screen ---------- */
  if (!name) {
    $("name").textContent = "MultiRead";
    $("home").hidden = false; $("openBtn").hidden = true; $("nightBtn").hidden = true;
    try {
      var rec = JSON.parse(Native.getRecents() || "[]");
      if (rec.length) {
        var box = $("recent"); box.innerHTML = "<h4>Recent</h4>";
        rec.forEach(function (r, i) {
          var b = document.createElement("button"); b.textContent = r.n;
          b.onclick = function () { Native.openRecent(i); };
          box.appendChild(b);
        });
      }
    } catch (e) {}
    return;
  }
  $("name").textContent = name;
  show("Opening…");

  /* ---------- zoom / scaling ---------- */
  var zoom = 1, base = 1, natW = viewW();
  var ZMIN = 0.5, ZMAX = 5;
  function eff() { return zoom * base; }
  function layoutScaler() {
    var e = eff();
    var cw = Math.max(view.scrollWidth, view.offsetWidth), ch = view.offsetHeight;
    scaler.style.width = Math.ceil(cw * e) + "px";
    scaler.style.height = Math.ceil(ch * e) + "px";
  }
  function setNat(nat) {
    var W = viewW();
    if (nat > W) { natW = nat; base = W / nat; } else { natW = W; base = 1; }
    view.style.width = natW + "px";
  }
  setNat(viewW());
  function applyZoom(z, cx, cy) {
    z = clamp(z, ZMIN, ZMAX);
    if (cx == null) { cx = window.innerWidth / 2; cy = window.innerHeight / 2; }
    var e0 = eff(), sx = window.scrollX, sy = window.scrollY, oy = scaler.offsetTop;
    var fx = (sx + cx) / e0, fy = (sy + cy - oy) / e0;
    zoom = z;
    var e1 = eff();
    view.style.transform = "scale(" + e1 + ")";
    layoutScaler();
    window.scrollTo(fx * e1 - cx, fy * e1 + oy - cy);
    $("zl").textContent = Math.round(zoom * 100) + "%";
    onZoomMoved();
  }
  $("zIn").onclick = function () { applyZoom(zoom * 1.25); };
  $("zOut").onclick = function () { applyZoom(zoom / 1.25); };
  $("zl").onclick = function () { applyZoom(1); };
  if (typeof ResizeObserver !== "undefined") new ResizeObserver(layoutScaler).observe(view);

  // pinch + double tap
  var pin = null, lastTap = { t: 0, x: 0, y: 0 }, tapStart = null;
  function dist(t) { return Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY); }
  function mid(t) { return [(t[0].clientX + t[1].clientX) / 2, (t[0].clientY + t[1].clientY) / 2]; }
  document.addEventListener("touchstart", function (e) {
    if (e.target.closest && e.target.closest("#tb, #hdr")) { tapStart = null; return; }
    if (e.touches.length === 2) { pin = { d: dist(e.touches), z: zoom }; tapStart = null; }
    else if (e.touches.length === 1) tapStart = { t: Date.now(), x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: true });
  document.addEventListener("touchmove", function (e) {
    if (pin && e.touches.length === 2) {
      e.preventDefault();
      var m = mid(e.touches);
      applyZoom(pin.z * dist(e.touches) / pin.d, m[0], m[1]);
    } else if (tapStart) {
      var t = e.touches[0];
      if (Math.hypot(t.clientX - tapStart.x, t.clientY - tapStart.y) > 10) tapStart = null;
    }
  }, { passive: false });
  document.addEventListener("touchend", function (e) {
    if (pin && e.touches.length < 2) { pin = null; return; }
    if (tapStart && Date.now() - tapStart.t < 250) {
      var now = Date.now();
      if (now - lastTap.t < 320 && Math.hypot(tapStart.x - lastTap.x, tapStart.y - lastTap.y) < 40) {
        applyZoom(zoom > 1.3 ? 1 : 2.5, tapStart.x, tapStart.y); lastTap.t = 0;
      } else { lastTap = { t: now, x: tapStart.x, y: tapStart.y }; }
    }
    tapStart = null;
  }, { passive: true });

  /* ---------- paging / counter ---------- */
  var nav = null, pageEls = [], sheetIdx = 0, sheetCount = 0, showSheetFn = null;
  function pagedNav(els) {
    pageEls = els;
    nav = {
      count: function () { return pageEls.length; },
      cur: function () {
        var probe = hdrH() + 30, best = 0;
        for (var i = 0; i < pageEls.length; i++) {
          if (pageEls[i].getBoundingClientRect().top <= probe) best = i; else break;
        }
        return best + 1;
      },
      go: function (n) {
        n = clamp(n, 1, pageEls.length);
        var r = pageEls[n - 1].getBoundingClientRect();
        window.scrollTo(window.scrollX, window.scrollY + r.top - hdrH() - 4);
      }
    };
  }
  function sheetNav() {
    nav = { count: function () { return sheetCount; }, cur: function () { return sheetIdx + 1; },
            go: function (n) { showSheetFn(clamp(n, 1, sheetCount) - 1); } };
  }
  function updateCounter() {
    var el = $("pg");
    if (nav) el.textContent = (kind === "sheet" ? "Sheet " : "") + nav.cur() + " / " + nav.count();
    else {
      var max = document.documentElement.scrollHeight - window.innerHeight;
      el.textContent = max > 20 ? Math.round(100 * clamp(window.scrollY / max, 0, 1)) + "%" : "–";
    }
  }
  var ticking = false;
  window.addEventListener("scroll", function () {
    if (ticking) return; ticking = true;
    requestAnimationFrame(function () { ticking = false; updateCounter(); savePosSoon(); });
  }, { passive: true });

  $("pPrev").onclick = function () {
    if (nav) nav.go(nav.cur() - 1); else window.scrollBy(0, -window.innerHeight * 0.85);
  };
  $("pNext").onclick = function () {
    if (nav) nav.go(nav.cur() + 1); else window.scrollBy(0, window.innerHeight * 0.85);
  };
  $("pg").onclick = function () {
    if (!nav) return;
    var b = $("pg"), inp = document.createElement("input");
    inp.id = "pgIn"; inp.type = "number"; inp.min = 1; inp.max = nav.count(); inp.value = nav.cur();
    inp.inputMode = "numeric";
    b.replaceWith(inp); inp.focus(); inp.select();
    var done = false;
    function finish(go) {
      if (done) return; done = true;
      var n = parseInt(inp.value, 10);
      inp.replaceWith(b);
      if (go && n) nav.go(n);
      updateCounter();
    }
    inp.onkeydown = function (e) { if (e.key === "Enter") finish(true); else if (e.key === "Escape") finish(false); };
    inp.onblur = function () { finish(false); };
  };

  /* ---------- remember position ---------- */
  var saveT = null;
  function savePosSoon() {
    if (!docKey) return;
    clearTimeout(saveT);
    saveT = setTimeout(function () {
      var o = {};
      if (kind === "sheet") o.s = sheetIdx;
      else if (nav) o.p = nav.cur();
      else { var max = document.documentElement.scrollHeight - window.innerHeight; o.f = max > 0 ? window.scrollY / max : 0; }
      lsSet("pos:" + docKey, JSON.stringify(o));
    }, 500);
  }
  function restorePos() {
    var o = null; try { o = JSON.parse(lsGet("pos:" + docKey) || "null"); } catch (e) {}
    if (!o) return;
    if (o.s != null && showSheetFn) showSheetFn(o.s);
    else if (o.p && nav) nav.go(o.p);
    else if (o.f) {
      var max = document.documentElement.scrollHeight - window.innerHeight;
      window.scrollTo(0, o.f * max);
    }
  }

  /* ---------- find ---------- */
  var S = { q: "", hits: [], cur: -1, tok: 0, pageHits: {}, pending: null };
  var findOpen = false;
  var fq = $("q"), fcount = $("fcount");
  function fLabel(txt) { fcount.textContent = txt; }
  function setFind(open) {
    findOpen = open; $("findbar").hidden = !open; $("findBtn").classList.toggle("on", open);
    if (open) { fq.focus(); fq.select(); } else { fq.blur(); runSearch(""); }
  }
  $("findBtn").onclick = function () { setFind(!findOpen); };
  $("fclose").onclick = function () { setFind(false); };
  var findT = null;
  fq.oninput = function () { clearTimeout(findT); findT = setTimeout(function () { runSearch(fq.value.trim()); }, 220); };
  fq.onkeydown = function (e) { if (e.key === "Enter") { e.preventDefault(); stepHit(e.shiftKey ? -1 : 1); } };
  $("fnext").onclick = function () { stepHit(1); };
  $("fprev").onclick = function () { stepHit(-1); };

  function searchDocs() {
    var f = view.querySelector("iframe.htmlframe");
    if (f) { try { return [f.contentDocument.body]; } catch (e) { return []; } }
    return [view];
  }
  function clearMarks() {
    searchDocs().forEach(function (root) {
      var ms = root.querySelectorAll("mark.hl[data-d]");
      Array.prototype.forEach.call(ms, function (m) {
        var p = m.parentNode; p.replaceChild(m.ownerDocument.createTextNode(m.textContent), m); p.normalize();
      });
    });
    if (kind === "pdf") pdfClearMarks();
  }
  function runSearch(qs) {
    S.tok++;
    clearMarks();
    S.hits = []; S.cur = -1; S.q = qs; S.pageHits = {}; S.pending = null;
    if (!qs) { fLabel(""); return; }
    if (kind === "pdf") { pdfSearch(qs, S.tok); return; }
    var qL = qs.toLowerCase(), marks = [];
    searchDocs().forEach(function (root) {
      var doc = root.ownerDocument, walker = doc.createTreeWalker(root, NodeFilter.SHOW_TEXT, null), nodes = [], n;
      while ((n = walker.nextNode())) {
        var pt = n.parentNode && n.parentNode.nodeName;
        if (pt === "SCRIPT" || pt === "STYLE" || pt === "MARK") continue;
        if (n.nodeValue.toLowerCase().indexOf(qL) >= 0) nodes.push(n);
      }
      nodes.forEach(function (node) {
        if (marks.length > 3000) return;
        var text = node.nodeValue, lo = text.toLowerCase(), pos = 0, at, frag = doc.createDocumentFragment();
        while ((at = lo.indexOf(qL, pos)) >= 0) {
          if (at > pos) frag.appendChild(doc.createTextNode(text.slice(pos, at)));
          var m = doc.createElement("mark"); m.className = "hl"; m.setAttribute("data-d", "1");
          m.textContent = text.slice(at, at + qL.length);
          if (root !== view) { m.style.background = "#ffd54a"; m.style.color = "#000"; }
          frag.appendChild(m); marks.push(m); pos = at + qL.length;
        }
        if (pos < text.length) frag.appendChild(doc.createTextNode(text.slice(pos)));
        node.parentNode.replaceChild(frag, node);
      });
    });
    S.hits = marks;
    if (!marks.length) { fLabel("No results"); return; }
    var first = 0;
    for (var i = 0; i < marks.length; i++) { if (marks[i].getBoundingClientRect().top >= hdrH() + 20) { first = i; break; } }
    S.cur = first; focusHit();
  }
  function stepHit(d) {
    if (!S.hits.length) { if (fq.value.trim()) runSearch(fq.value.trim()); return; }
    S.cur = (S.cur + d + S.hits.length) % S.hits.length; focusHit();
  }
  function focusHit() {
    var n = S.hits.length;
    fLabel(n >= 3000 ? (S.cur + 1) + "/3000+" : (S.cur + 1) + "/" + n);
    if (kind === "pdf") { pdfFocus(); return; }
    Array.prototype.forEach.call(document.querySelectorAll("mark.hl.cur"), function (m) { m.classList.remove("cur"); });
    searchDocs().forEach(function (r) {
      Array.prototype.forEach.call(r.querySelectorAll("mark.hl.cur"), function (m) { m.classList.remove("cur"); m.style.background = "#ffd54a"; });
    });
    var m = S.hits[S.cur];
    m.classList.add("cur");
    if (m.ownerDocument !== document) m.style.background = "#ff8a3d";
    m.scrollIntoView({ block: "center", inline: "center" });
  }

  /* ---------- PDF ---------- */
  var pdf = { doc: null, holders: [], tc: {}, io: null, dpr: Math.min(window.devicePixelRatio || 1, 2) };
  function pdfQZ() { return clamp(Math.ceil(eff() * 2) / 2, 1, 4); }
  function pdfGetText(i) {
    if (!pdf.tc[i]) pdf.tc[i] = pdf.holders[i]._page.getTextContent();
    return pdf.tc[i];
  }
  function pdfRender(d) {
    var s = pdfQZ();
    if (d._rz === s && d._canvas) return;
    if (d._task) { try { d._task.cancel(); } catch (e) {} }
    var seq = ++d._seq;
    var rs = d._scale * s * pdf.dpr;
    var px = d._w1 * rs * d._h1 * rs;
    if (px > 7e6) rs *= Math.sqrt(7e6 / px);
    var vp = d._page.getViewport({ scale: rs });
    var c = document.createElement("canvas");
    c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
    var t = d._page.render({ canvasContext: c.getContext("2d"), viewport: vp });
    d._task = t;
    t.promise.then(function () {
      if (seq !== d._seq || !d._on) return;
      if (d._canvas) d._canvas.remove();
      d.insertBefore(c, d.firstChild); d._canvas = c; d._rz = s;
    }).catch(function () {});
  }
  async function pdfText(d) {
    if (d._tl || d._tlBusy) return;
    d._tlBusy = true;
    try {
      var tc = await pdfGetText(d._i);
      if (!d._on) { d._tlBusy = false; return; }
      var tl = document.createElement("div"); tl.className = "textLayer";
      tl.style.setProperty("--scale-factor", d._scale);
      d.appendChild(tl);
      var divs = [], strs = [];
      var task = pdfjsLib.renderTextLayer({
        textContentSource: tc, container: tl, viewport: d._page.getViewport({ scale: d._scale }),
        textDivs: divs, textContentItemsStr: strs
      });
      await task.promise;
      if (!d._on) { tl.remove(); d._tlBusy = false; return; }
      d._tl = tl; d._divs = divs; d._strs = strs; d._marked = [];
      pdfApplyMarks(d);
    } catch (e) {}
    d._tlBusy = false;
  }
  function pdfEnter(d) { if (d._on) return; d._on = true; pdfRender(d); pdfText(d); }
  function pdfLeave(d) {
    if (!d._on) return;
    d._on = false; d._seq++;
    if (d._task) { try { d._task.cancel(); } catch (e) {} }
    if (d._canvas) { d._canvas.remove(); d._canvas = null; }
    if (d._tl) { d._tl.remove(); d._tl = null; d._divs = null; d._strs = null; }
    d._rz = 0;
  }
  function layoutPdf() {
    setNat(viewW());
    pdf.holders.forEach(function (d) {
      d._scale = natW / d._w1;
      d.style.width = natW + "px";
      d.style.height = Math.floor(d._h1 * d._scale) + "px";
      if (d._on) { pdfLeave(d); if (d._vis) pdfEnter(d); }
    });
    layoutScaler();
  }
  var zT = null;
  function onZoomMoved() {
    clearTimeout(zT);
    zT = setTimeout(function () {
      if (kind === "pdf") pdf.holders.forEach(function (d) { if (d._on) pdfRender(d); });
      updateCounter();
    }, 260);
  }
  async function renderPdf(buf) {
    pdfjsLib.GlobalWorkerOptions.workerSrc = "lib/pdf.worker.min.js";
    pdf.doc = await pdfjsLib.getDocument({ data: new Uint8Array(buf) }).promise;
    var W = viewW();
    for (var i = 0; i < pdf.doc.numPages; i++) {
      var page = await pdf.doc.getPage(i + 1);
      var vp1 = page.getViewport({ scale: 1 });
      var d = document.createElement("div");
      d.className = "pdfpage"; d._page = page; d._i = i; d._w1 = vp1.width; d._h1 = vp1.height;
      d._scale = W / vp1.width; d._seq = 0; d._on = false; d._vis = false; d._rz = 0;
      d.style.width = W + "px"; d.style.height = Math.floor(vp1.height * d._scale) + "px";
      view.appendChild(d); pdf.holders.push(d);
      if (i === 0) clearMsg();
    }
    pdf.io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        var d = en.target; d._vis = en.isIntersecting;
        if (en.isIntersecting) pdfEnter(d); else pdfLeave(d);
      });
    }, { rootMargin: "700px 0px" });
    pdf.holders.forEach(function (h) { pdf.io.observe(h); });
    pagedNav(pdf.holders);
  }
  function pdfClearMarks() {
    pdf.holders.forEach(function (d) {
      if (d._divs && d._marked && d._marked.length) {
        d._marked.forEach(function (j) { if (d._divs[j]) d._divs[j].textContent = d._strs[j]; });
        d._marked = [];
      }
    });
  }
  function pdfApplyMarks(d) {
    var idxs = S.pageHits[d._i];
    if (!idxs || !d._divs) return;
    var byItem = {}, ql = S.q.toLowerCase();
    idxs.forEach(function (h) { var it = S.hits[h].item; (byItem[it] = byItem[it] || []).push(h); });
    Object.keys(byItem).forEach(function (j) {
      var div = d._divs[j], str = d._strs[j];
      if (!div || typeof str !== "string") return;
      var lo = str.toLowerCase(), pos = 0, out = "", hs = byItem[j];
      for (var t = 0; t < hs.length; t++) {
        var at = lo.indexOf(ql, pos); if (at < 0) break;
        out += esc(str.slice(pos, at)) + '<mark class="hl" data-h="' + hs[t] + '">' + esc(str.slice(at, at + ql.length)) + "</mark>";
        pos = at + ql.length;
      }
      div.innerHTML = out + esc(str.slice(pos));
      d._marked.push(j);
    });
    if (S.pending != null && S.hits[S.pending] && S.hits[S.pending].page === d._i) pdfFocus();
  }
  async function pdfSearch(qs, tok) {
    var ql = qs.toLowerCase(), hits = [], pageHits = {};
    fLabel("Searching…");
    for (var i = 0; i < pdf.holders.length; i++) {
      if (tok !== S.tok) return;
      var tc; try { tc = await pdfGetText(i); } catch (e) { continue; }
      var j = -1;
      for (var k = 0; k < tc.items.length; k++) {
        var str = tc.items[k].str; if (typeof str !== "string") continue; j++;
        var lo = str.toLowerCase(), pos = 0, at;
        while ((at = lo.indexOf(ql, pos)) >= 0) {
          (pageHits[i] = pageHits[i] || []).push(hits.length);
          hits.push({ page: i, item: j }); pos = at + ql.length;
          if (hits.length >= 3000) break;
        }
        if (hits.length >= 3000) break;
      }
      if (hits.length >= 3000) break;
    }
    if (tok !== S.tok) return;
    S.hits = hits; S.pageHits = pageHits;
    if (!hits.length) { fLabel("No results"); return; }
    var cp = nav.cur() - 1, first = 0;
    for (var h = 0; h < hits.length; h++) { if (hits[h].page >= cp) { first = h; break; } }
    S.cur = first;
    pdf.holders.forEach(function (d) { if (d._tl) pdfApplyMarks(d); });
    focusHit();
  }
  function pdfFocus() {
    var hit = S.hits[S.cur]; if (!hit) return;
    var d = pdf.holders[hit.page];
    Array.prototype.forEach.call(view.querySelectorAll("mark.hl.cur"), function (m) { m.classList.remove("cur"); });
    var m = d._tl && d.querySelector('mark[data-h="' + S.cur + '"]');
    if (m) { S.pending = null; m.classList.add("cur"); m.scrollIntoView({ block: "center", inline: "center" }); }
    else { S.pending = S.cur; nav.go(hit.page + 1); }
  }

  /* ---------- Word ---------- */
  async function renderDocx(buf) {
    var box = document.createElement("div"); view.appendChild(box);
    await docx.renderAsync(buf, box, null, {
      className: "docx", inWrapper: true, ignoreWidth: false, ignoreHeight: false,
      breakPages: true, renderHeaders: true, renderFooters: true, renderFootnotes: true
    });
    var secs = Array.prototype.slice.call(box.querySelectorAll(".docx-wrapper > section"));
    function fit() {
      var max = 0; secs.forEach(function (s) { max = Math.max(max, s.offsetWidth); });
      setNat(max + 16); layoutScaler();
    }
    fit(); view._refit = fit;
    pagedNav(secs.length ? secs : []);
    if (!secs.length) nav = null;
  }

  /* ---------- PowerPoint ---------- */
  async function renderPptx(buf) {
    var box = document.createElement("div"); view.appendChild(box);
    var w = viewW() - 16;
    var p = pptxPreview.init(box, { width: w, height: Math.round(w * 9 / 16) });
    await p.preview(buf);
    var sl = Array.prototype.slice.call(box.querySelectorAll(".pptx-preview-slide-wrapper"));
    if (sl.length) pagedNav(sl);
  }

  /* ---------- Spreadsheets ---------- */
  function renderSheet(buf) {
    kind = "sheet";
    var wb = XLSX.read(new Uint8Array(buf), { type: "array", cellDates: true });
    var tabs = $("tabs"), holder = document.createElement("div");
    view.appendChild(holder);
    sheetCount = wb.SheetNames.length;
    showSheetFn = function (i) {
      i = clamp(i, 0, sheetCount - 1); sheetIdx = i;
      Array.prototype.forEach.call(tabs.children, function (b, k) { b.className = k === i ? "on" : ""; });
      if (S.q) { S.hits = []; S.cur = -1; }
      var ws = wb.Sheets[wb.SheetNames[i]];
      holder.innerHTML = "";
      if (!ws || !ws["!ref"]) { holder.innerHTML = '<div class="note">Empty sheet</div>'; }
      else {
        var r = XLSX.utils.decode_range(ws["!ref"]), note = "";
        if (r.e.r > 4999) { r.e.r = 4999; note = "Showing the first 5,000 rows."; }
        var w2 = Object.assign({}, ws, { "!ref": XLSX.utils.encode_range(r) });
        var d = document.createElement("div"); d.className = "sheet";
        d.innerHTML = XLSX.utils.sheet_to_html(w2, { header: "", footer: "" });
        holder.appendChild(d);
        if (note) { var n = document.createElement("div"); n.className = "note"; n.textContent = note; holder.appendChild(n); }
      }
      window.scrollTo(0, 0); layoutScaler(); updateCounter(); savePosSoon();
      if (findOpen && S.q) runSearch(S.q);
    };
    if (sheetCount > 1) wb.SheetNames.forEach(function (s, i) {
      var b = document.createElement("button"); b.textContent = s; b.onclick = function () { showSheetFn(i); };
      tabs.appendChild(b);
    });
    showSheetFn(0); sheetNav();
  }

  /* ---------- Images ---------- */
  function renderImage(buf, mime) {
    return new Promise(function (res, rej) {
      var img = new Image(); img.className = "pic";
      img.onload = function () { res(); }; img.onerror = function () { rej(new Error("Unsupported image.")); };
      img.src = URL.createObjectURL(new Blob([buf], { type: mime }));
      view.appendChild(img);
    });
  }

  /* ---------- HTML (scripts disabled) ---------- */
  function renderHtml(buf) {
    var html = new TextDecoder("utf-8").decode(buf);
    var f = document.createElement("iframe");
    f.className = "htmlframe"; f.setAttribute("sandbox", "allow-same-origin"); f.srcdoc = html;
    f.onload = function () {
      try { f.style.height = Math.max(f.contentDocument.documentElement.scrollHeight, 400) + "px"; } catch (e) {}
      layoutScaler();
    };
    view.appendChild(f);
    var n = document.createElement("div"); n.className = "slide-note";
    n.textContent = "Scripts are turned off; external resources won't load.";
    view.appendChild(n);
  }

  /* ---------- Text ---------- */
  function renderText(buf) {
    var pre = document.createElement("pre"); pre.className = "txt";
    pre.textContent = new TextDecoder("utf-8").decode(buf);
    view.appendChild(pre);
  }

  /* ---------- Legacy .doc (best-effort text only) ---------- */
  function renderLegacyDoc(buf) {
    var c = XLSX.CFB.read(new Uint8Array(buf), { type: "array" });
    var e = XLSX.CFB.find(c, "WordDocument");
    if (!e) throw new Error("Not a Word 97–2003 file.");
    var d = e.content, dv = new DataView(d.buffer, d.byteOffset, d.byteLength);
    var fcMin = dv.getUint32(0x18, true), fcMac = dv.getUint32(0x1C, true);
    if (!(fcMac > fcMin) || fcMac > d.length) { fcMin = 0x200; fcMac = d.length; }
    var seg = d.subarray(fcMin, fcMac), zeros = 0;
    for (var i = 0; i < Math.min(seg.length, 400); i++) if (seg[i] === 0) zeros++;
    var text = zeros > 60 ? new TextDecoder("utf-16le").decode(seg) : new TextDecoder("windows-1252").decode(seg);
    text = text.replace(/\r\n?/g, "\n").replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, " ")
               .replace(/\x07/g, "\t").replace(/[ \t]{3,}/g, "  ");
    var n = document.createElement("div"); n.className = "slide-note";
    n.textContent = "Old .doc format: showing text only, without layout or images.";
    view.appendChild(n);
    var pre = document.createElement("pre"); pre.className = "txt"; pre.textContent = text.trim();
    view.appendChild(pre);
  }

  /* ---------- Legacy .ppt (best-effort text only) ---------- */
  function renderLegacyPpt(buf) {
    var c = XLSX.CFB.read(new Uint8Array(buf), { type: "array" });
    var e = XLSX.CFB.find(c, "PowerPoint Document");
    if (!e) throw new Error("Not a PowerPoint 97–2003 file.");
    var d = e.content, dv = new DataView(d.buffer, d.byteOffset, d.byteLength);
    var slides = [], cur = null;
    function walk(start, end) {
      var p = start;
      while (p + 8 <= end) {
        var verInst = dv.getUint16(p, true), type = dv.getUint16(p + 2, true), len = dv.getUint32(p + 4, true);
        var body = p + 8, next = body + len;
        if (next > end) break;
        if ((verInst & 0xF) === 0xF) {
          if (type === 0x03EE) { cur = []; slides.push(cur); }
          walk(body, next);
        } else if (type === 0x0FA0 || type === 0x0FA8) {
          var bytes = d.subarray(body, next);
          var t = type === 0x0FA0 ? new TextDecoder("utf-16le").decode(bytes) : new TextDecoder("windows-1252").decode(bytes);
          t = t.replace(/\r\n?|\v/g, "\n").replace(/[\x00-\x08\x0E-\x1F]/g, "").trim();
          if (t) { if (!cur) { cur = []; slides.push(cur); } cur.push(t); }
        }
        p = next;
      }
    }
    walk(0, d.length);
    var n = document.createElement("div"); n.className = "slide-note";
    n.textContent = "Old .ppt format: showing slide text only, without layout or images.";
    view.appendChild(n);
    var wrap = document.createElement("div"); wrap.className = "legacy";
    var els = [];
    slides.forEach(function (s, i) {
      if (!s.length) return;
      var h = document.createElement("h3"); h.textContent = "Slide " + (i + 1);
      var b = document.createElement("div"); b.className = "slide"; b.textContent = s.join("\n\n");
      wrap.appendChild(h); wrap.appendChild(b); els.push(h);
    });
    if (!wrap.children.length) throw new Error("No readable text found.");
    view.appendChild(wrap);
    pagedNav(els);
  }

  /* ---------- routing ---------- */
  var IMG = { png:"image/png", jpg:"image/jpeg", jpeg:"image/jpeg", gif:"image/gif", webp:"image/webp",
              bmp:"image/bmp", svg:"image/svg+xml", avif:"image/avif", ico:"image/x-icon" };
  var TEXT = ["txt","md","log","json","xml","yml","yaml","ini","cfg","rtf","tex","srt","vtt"];
  var SHEET = ["xlsx","xlsm","xlsb","xls","ods","csv","tsv"];

  async function sniff(buf) {
    var u = new Uint8Array(buf.slice(0, 8));
    if (u[0] === 0x25 && u[1] === 0x50) return "pdf";
    if (u[0] === 0x89 && u[1] === 0x50) return "png";
    if (u[0] === 0xFF && u[1] === 0xD8) return "jpg";
    if (u[0] === 0x50 && u[1] === 0x4B) {
      var z = await JSZip.loadAsync(buf);
      if (z.file("word/document.xml")) return "docx";
      if (z.file("xl/workbook.xml")) return "xlsx";
      if (z.file("ppt/presentation.xml")) return "pptx";
      return "zip";
    }
    if (u[0] === 0xD0 && u[1] === 0xCF) {
      var c = XLSX.CFB.read(new Uint8Array(buf), { type: "array" });
      if (XLSX.CFB.find(c, "WordDocument")) return "doc";
      if (XLSX.CFB.find(c, "PowerPoint Document")) return "ppt";
      if (XLSX.CFB.find(c, "Workbook") || XLSX.CFB.find(c, "Book")) return "xls";
    }
    return "txt";
  }

  async function route(buf) {
    var k = ext;
    var known = ["pdf","docx","doc","pptx","ppt","html","htm","xhtml"].concat(Object.keys(IMG), TEXT, SHEET);
    if (known.indexOf(k) < 0) k = await sniff(buf);
    if (k === "docm" || k === "dotx") k = "docx";
    if (k === "pptm" || k === "ppsx") k = "pptx";
    kind = k;
    if (SHEET.indexOf(k) >= 0) kind = "sheet";
    else if (IMG[k]) kind = "image";
    else if (["html","htm","xhtml"].indexOf(k) >= 0) kind = "html";
    $("tb").hidden = false;
    $("findBtn").hidden = (kind === "image");
    if (k === "pdf") return renderPdf(buf);
    if (k === "docx") return renderDocx(buf);
    if (k === "doc") return renderLegacyDoc(buf);
    if (k === "pptx") return renderPptx(buf);
    if (k === "ppt") return renderLegacyPpt(buf);
    if (kind === "sheet") return renderSheet(buf);
    if (kind === "image") return renderImage(buf, IMG[k]);
    if (kind === "html") return renderHtml(buf);
    if (k === "zip") throw new Error("This archive isn't a supported document.");
    kind = "text";
    return renderText(buf);
  }

  var resizeT = null, lastW = viewW();
  window.addEventListener("resize", function () {
    clearTimeout(resizeT);
    resizeT = setTimeout(function () {
      if (viewW() === lastW) return;
      lastW = viewW();
      if (kind === "pdf") layoutPdf();
      else if (view._refit) view._refit();
      else { setNat(viewW()); layoutScaler(); }
      view.style.transform = "scale(" + eff() + ")";
      updateCounter();
    }, 160);
  });

  fetch("/doc/file?t=" + Date.now(), { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error("Could not read the file."); return r.arrayBuffer(); })
    .then(function (buf) { docKey = name + ":" + buf.byteLength; return route(buf); })
    .then(function () {
      clearMsg();
      view.style.transform = "scale(" + eff() + ")";
      layoutScaler(); updateCounter();
      setTimeout(function () { restorePos(); updateCounter(); }, 80);
    })
    .catch(function (e) { show("Couldn't display this file.\n" + (e && e.message ? e.message : e), true); });
})();
</script>
</body>
